[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carculator_bus"
dynamic = ["version"]
description = "Prospective life cycle assessment of buses"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Romain Sacchi", email = "romain.sacchi@psi.ch"}]
dependencies = ["carculator_utils>=1.3.7", "prettytable"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: BSD License",
]

[project.urls]
Homepage = "https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator_bus"
Documentation = "https://carculator-bus.readthedocs.io/"
Changelog = "https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator_bus/blob/master/CHANGELOG.md"
Issues = "https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator_bus/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov", "hypothesis>=6", "openpyxl", "xlsxwriter"]
docs = ["sphinx", "sphinx-immaterial", "sphinx-copybutton", "sphinx-design", "sphinxcontrib-bibtex"]
excel = ["carculator_utils[excel]>=1.3.7"]
brightway = ["carculator_utils[brightway]>=1.3.7"]

[tool.setuptools.dynamic]
version = {attr = "carculator_bus._version.VERSION"}

[tool.setuptools.packages.find]
include = ["carculator_bus", "carculator_bus.*"]

[tool.setuptools.package-data]
carculator_bus = ["data/*.json", "data/*.yaml", "data/*.yml", "data/*.csv", "data/*.npz", "data/*.xlsx", "data/**/*.json", "data/**/*.yaml", "data/**/*.yml", "data/**/*.csv", "data/**/*.npz", "data/**/*.xlsx"]

[tool.setuptools.exclude-package-data]
"*" = ["**/.DS_Store", "**/__pycache__/*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
